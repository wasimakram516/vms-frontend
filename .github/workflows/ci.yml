name: Sinan VMS Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
      - uat

concurrency:
  group: sinan-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid/api/v1
          NEXT_PUBLIC_SOCKET_URL: https://example.invalid
